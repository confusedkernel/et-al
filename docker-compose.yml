services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]

  web:
    build: ./frontend
    restart: unless-stopped

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://etal:${POSTGRES_PASSWORD:-etal}@postgres:5432/etal
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    restart: unless-stopped
    command: arq app.worker.WorkerSettings
    env_file: .env
    environment: *backend-env
    depends_on: [api]

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: etal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etal}
      POSTGRES_DB: etal
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etal"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  pg_data:
  redis_data:
